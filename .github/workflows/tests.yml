name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The checks boot the whole site against a throwaway in-memory database; they only need an app key
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, pdo_sqlite, sqlite3, zip, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: touch .env
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npm run build

      - name: Site checks (pages, forms, admin, emails, images, translations)
        run: vendor/bin/pest
